name = "hermes-mind-link"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "mind-link"
database_id = "a09607ad-6bd0-4239-93be-f85d0bf4f1e4"

[vars]
APP_NAME = "Mind-link"
PUBLIC_ORIGIN = "https://hermes-mind-link.vyqno-xyz.workers.dev"
# Set after creating the platform bot (no @)
# TELEGRAM_BOT_USERNAME = "YourMindLinkBot"

# We deliver — users never poll
[triggers]
crons = ["* * * * *"]
