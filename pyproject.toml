[project]
name = "hermes-mind-link"
version = "0.3.0"
description = "Mind-to-mind agent mesh for Hermes: Telegram human surface + A2A peer agents + trust gates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OSPYR / Hitesh" }]
keywords = ["hermes", "a2a", "telegram", "agent", "mind-link"]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mind-link = "mind_link.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
